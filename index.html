<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weed Pong</title>
<style>
:root{--bg:#f5ecd9;--fg:#2b1d0e;--acc:#8b2e1a;--card:#fffaf0;--bd:#d8c7a3;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1710;--fg:#f1e6cf;--acc:#e0765a;--card:#2a2117;--bd:#4a3b28}}
:root[data-theme="dark"]{--bg:#1d1710;--fg:#f1e6cf;--acc:#e0765a;--card:#2a2117;--bd:#4a3b28}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) img{filter:invert(1)}}
:root[data-theme="dark"] img{filter:invert(1)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;text-align:center;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.s{display:none;min-height:100vh;padding:20px;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.s.on{display:flex}
#sort{cursor:pointer;user-select:none}
#list{justify-content:flex-start}
h1{margin:0;color:var(--acc);font-size:clamp(2.2rem,9vw,4rem)}
p{margin:0;max-width:760px;line-height:1.45;font-size:clamp(1.4rem,5vw,2.1rem)}
small{opacity:.6;font-size:1.1rem}
.big{width:min(40vw,220px);height:auto}
.btn{font:inherit;font-size:1.6rem;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:18px 28px;width:min(90vw,420px);cursor:pointer}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--bd)}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;font:inherit;font-size:1.2rem;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:10px 16px;cursor:pointer;z-index:5}
.it{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;width:min(100%,760px)}
.it img{width:90px;flex:none}
.it h2{margin:0 0 4px;color:var(--acc);font-size:1.5rem}
.it span{font-size:1.2rem;line-height:1.4}
</style>
</head>

const I=[["Por Baixo das Pernas", "O jogador lança a bolinha por baixo de uma das pernas."], ["Tiro às Cegas", "O jogador lança a bolinha com os olhos fechados."], ["Quique Duplo", "A bolinha deve quicar DUAS vezes na mesa antes de entrar no copo."], ["Mão Boba", "O jogador lança a bolinha com sua mão ruim (a que não usa para escrever)."], ["Mão Emprestada", "O jogador pega a mão da pessoa à sua esquerda e a segura pelo pulso. Depois, ele põe a bolinha na palma da mão do outro jogador e impele o pulso que está segurando para lançar a bolinha."], ["Cabeceada", "O jogador põe a bolinha na testa e, depois, impulsiona a cabeça para frente, lançando a bolinha na direção do alvo."], ["Tiro Giratório", "O jogador lança a bolinha, fazendo-a girar como um pião antes de encostar no Tabuleiro-Alvo."], ["Tiro de Costas", "O jogador fica de pé, de costas para a mesa, e lança a bolinha (é permitido girar a cintura e/ou o pescoço para olhar o Tabuleiro-Alvo)."], ["Cortada", "O jogador lança a bolinha no ar, depois bate nela com a mão na direção da mesa."], ["Tiro Sentado", "O jogador senta no chão, abaixo da superfície da mesa, e lança a bolinha. Independente da altura do jogador, seus olhos devem ficar abaixo da superfície da mesa."], ["Debaixo da Mesa", "O jogador lança a bolinha com a mão abaixo da superfície da mesa."], ["Pirueta", "O jogador gira em torno de si, 360º, até estar novamente de frente para o Tabuleiro-Alvo. Ele deve lançar a bolinha rapidamente, antes de terminar a pirueta."], ["Tiro no AR", "O jogador deve saltar. Depois, ele lança a bolinha ainda no ar, antes de voltar ao chão."], ["Tiro à Distância", "O jogador fica de pé e dá um passo para se afastar da mesa. Depois, lança a bolinha normalmente."], ["Tiro de Besta", "O jogador põe a bolinha sobre o dorso da mão. Depois, usa a outra mão para dar um peteleco na bolinha em direção ao Tabuleiro-Alvo."], ["Arco-íris", "O lançamento precisa fazer uma parábola bem alta. Se for um tiro reto, não vale."], ["Sem preparação", "Pegue a bolinha e lance imediatamente, sem ensaiar o movimento."], ["Quique Triplo", "A bolinha deve quicar TRÊS vezes na mesa antes de entrar no copo."], ["Rebatida", "O jogador deve jogar a bolinha no amigo e o amigo deve rebater a bolinha no copo."], ["Lançamento Normal", "O jogador lança a bolinha normalmente, sem nenhuma restrição."]];

let last=-1;
function go(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===id));window.scrollTo(0,0);if(id==='sort')start();}
function start(){document.getElementById('m').innerHTML='<h1>Toque na tela</h1><p>Toque em qualquer lugar para sortear.</p>';}
let ent=(Date.now()^0x9e3779b9)>>>0,tapN=0;
function mix32(h){h>>>=0;h^=h>>>16;h=Math.imul(h,0x85ebca6b)>>>0;h^=h>>>13;h=Math.imul(h,0xc2b2ae35)>>>0;h^=h>>>16;return h>>>0}
function feed(){const a=arguments;for(let i=0;i<a.length;i++)ent=mix32((ent^mix32(Math.floor((a[i]||0)*1000)+tapN++))+0x7f4a7c15);}
function cryptoU32(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0}catch(e){return mix32(Date.now()^ent)}}
function rnd32(){
  const t=(typeof performance!=='undefined'?performance.now():Date.now());
  const x=cryptoU32()^mix32((Math.random()*4294967296)>>>0)^mix32(ent)^mix32(Math.floor(t*1000))^mix32(Date.now()&0xffffffff);
  ent=mix32(ent^x);
  return mix32(x);
}
function rndInt(n){const lim=Math.floor(4294967296/n)*n;let r;do{r=rnd32()}while(r>=lim);return r%n}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rndInt(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}
function drawIndex(n,last){const c=shuffle(Array.from({length:n},(_,i)=>i)).filter(i=>i!==last);return c[rndInt(c.length)]}

function pick(){const i=drawIndex(I.length,last);last=i;
const m=document.getElementById('m');m.innerHTML='<img class="big" alt=""><h1></h1><p></p><small>Toque para sortear de novo</small>';
m.querySelector('img').src='data:image/png;base64,'+IC[I[i][0]];m.querySelector('h1').textContent=I[i][0];m.querySelector('p').textContent=I[i][1];}
['pointerdown','pointermove','touchstart','touchmove','mousemove','keydown'].forEach(function(ev){window.addEventListener(ev,function(e){feed(performance.now(),e.clientX,e.clientY,e.timeStamp)},{passive:true})});
document.getElementById('sort').onclick=pick;
const L=document.getElementById('items');
I.forEach(([n,d])=>{const e=document.createElement('div');e.className='it';e.innerHTML='<img alt=""><div><h2></h2><span></span></div>';
e.querySelector('img').src='data:image/png;base64,'+IC[n];e.querySelector('h2').textContent=n;e.querySelector('span').textContent=d;L.appendChild(e);});
start();
